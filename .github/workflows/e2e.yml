name: e2e

# Runs the shared SDK E2E suite (SchematicHQ/actions/sdk-e2e) against this
# repo's test app in every config mode, including datastream and replicator.
#
# Unit tests exercise the bundled WASM only against fixtures; the E2E suite is
# what runs the real datastream path (full and partial company messages, cache
# merges, live rules engine evaluation). A WASM bump or a datastream change
# must go through it before release (SCH-7057).

on:
  pull_request:
    paths:
      - "WASM_VERSION"
      - "src/schematic/datastream/**"
      - "src/schematic/client.py"
      - "testapp/**"
      - ".github/workflows/e2e.yml"
  workflow_dispatch:
    inputs:
      api-base-url:
        description: "Schematic API base URL"
        required: false
        default: "https://api.schematichq.dev"
      sdk-source:
        description: "SDK source: local (build from source) or published (PyPI)"
        required: false
        type: choice
        options:
          - local
          - published
        default: "local"
      sdk-version:
        description: "SDK version to install (only used when sdk-source=published)"
        required: false
        default: ""

jobs:
  e2e:
    uses: SchematicHQ/actions/.github/workflows/sdk-e2e.yml@main
    with:
      python-version: "3.12"
      # The `datastream` extra pulls in websockets + wasmtime; they are optional
      # in the SDK but required for the datastream/replicator modes.
      setup: |
        pip install --upgrade pip
        if [ "$SDK_SOURCE" = "published" ]; then
          if [ -n "$SDK_VERSION" ]; then
            pip install "schematichq[datastream]==${SDK_VERSION}"
          else
            pip install 'schematichq[datastream]'
          fi
        else
          ./scripts/download-wasm.sh
          pip install '.[datastream]'
        fi
        pip install -r testapp/requirements.txt
      start: python testapp/app.py
      api-base-url: ${{ inputs.api-base-url || 'https://api.schematichq.dev' }}
      sdk-source: ${{ inputs.sdk-source || 'local' }}
      sdk-version: ${{ inputs.sdk-version || '' }}
    secrets: inherit
